<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesap Numarasını Kopyala</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0d0d1a;
            color: #ffffff;
            text-align: center;
        }
        .container {
            background-color: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
            max-width: 90%;
        }
        .motto {
            font-size: 1.2rem;
            color: #00d2ff;
            margin-bottom: 20px;
            font-style: italic;
            font-weight: 300;
        }
        .address-box {
            background-color: #0d0d1a;
            padding: 15px;
            border-radius: 10px;
            margin: 20px auto 20px;
            word-break: break-all;
            font-family: monospace;
            font-size: 1rem;
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.3);
            max-width: 400px;
        }
        button {
            background-color: #00d2ff;
            border: none;
            color: #000000;
            padding: 15px 30px;
            font-size: 1.1rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        button:hover {
            background-color: #ffffff;
            box-shadow: 0 0 15px #00d2ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="motto">
            "Geleceğin zekasını bugünden şekillendiriyoruz"
        </div>
        
        <h2>Destek Hesabı</h2>
        <p>Aşağıdaki butona basarak hesap numarasını otomatik olarak kopyalayabilirsiniz.</p>

        <button onclick="copyToClipboard()">Adresi Kopyala</button>

        <div class="address-box">
            0x70034a784d852bb06de0f85514f76269b255df9c
        </div>
    </div>

    <script>
        function copyToClipboard() {
            const accountNumber = "0x70034a784d852bb06de0f85514f76269b255df9c";
            navigator.clipboard.writeText(accountNumber).then(() => {
                alert("Hesap numarası panoya kopyalandı!");
            }).catch(err => {
                console.error('Kopyalama başarısız oldu:', err);
            });
        }
    </script>

</body>
</html>
